# Setup
title: 'Den saknade terminen'
url: https://itiquette.github.io
baseurl: /den-saknade-terminen
thumbnail: "/static/assets/thumbnails/default.png"

# Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:title/
future: true
# safe: true # breaks local rendering if enabled
timezone: Europe/Stockholm
analytics:
  tracking_id: G-P7WVHD84D1

collections:
  '2019':
    output: true
  '2020':
    output: true
  '2026':
    output: true

# Excludes
exclude:
  - AGENTS.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - README.md
  - browser.sh
  - docker-compose.yml
  - vendor
